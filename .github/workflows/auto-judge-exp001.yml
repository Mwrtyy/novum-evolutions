name: Auto-judge EXP-001 with GitHub Models

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/auto_judge_exp001.py'
      - '.github/workflows/auto-judge-exp001.yml'

permissions:
  contents: write
  models: read

jobs:
  judge:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run 72 blind judgments
        id: judge
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JUDGE_MODEL: openai/gpt-4.1
        run: python scripts/auto_judge_exp001.py

      - name: Commit locked judgments
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/EXP-001/visible/judgments
          if ! git diff --cached --quiet; then
            git commit -m "Record EXP-001 automated blind judgments"
            git push
          fi

      - name: Require complete judging
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('results/EXP-001/visible/judgments/AUTO_JUDGE_STATUS.json')
          if not p.exists():
              raise SystemExit('missing auto-judge status')
          s = json.loads(p.read_text())
          if s.get('failed'):
              raise SystemExit(f"incomplete: {len(s['failed'])} judgments failed; rerun resumes missing judgments")
          print('All automated blind judgments completed.')
          PY

name: ArgmaxSpec greedy EXP-003

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      TS3_BLOCKS: '256'
      TS3_CTX: '32'
      TS3_K: '4'
      TS3_BS: '8'
      TS3_GROUP: '64'
      TS3_SEED: '20260817'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers>=4.48,<5' safetensors numpy
      - name: Run frozen greedy benchmark
        run: python research/thresholdspec/greedy_argmax_benchmark.py
      - name: Show summary
        if: always()
        run: cat results/thresholdspec-greedy-exp003/summary.json || true
      - name: Upload raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thresholdspec-greedy-exp003
          path: results/thresholdspec-greedy-exp003/
          if-no-files-found: error

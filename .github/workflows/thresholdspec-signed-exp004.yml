name: SignedRankSpec EXP-004

on:
  pull_request:
    paths:
      - 'research/thresholdspec/EXP-TS-004-signed-ranking.md'
      - 'research/thresholdspec/greedy_signed_rank_benchmark.py'
      - '.github/workflows/thresholdspec-signed-exp004.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers>=4.48,<5' safetensors numpy
      - name: Run frozen signed-ranking benchmark
        run: python research/thresholdspec/greedy_signed_rank_benchmark.py
      - name: Show summary
        if: always()
        run: cat results/thresholdspec-signed-exp004/summary.json || true
      - name: Upload raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thresholdspec-signed-exp004
          path: results/thresholdspec-signed-exp004/
          if-no-files-found: error

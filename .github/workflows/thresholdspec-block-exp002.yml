name: ThresholdSpec stochastic block EXP-002

on:
  pull_request:
    paths:
      - 'research/thresholdspec/EXP-TS-002-block-economics.md'
      - 'research/thresholdspec/block_benchmark.py'
      - '.github/workflows/thresholdspec-block-exp002.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      TS2_BLOCKS: '256'
      TS2_CTX: '32'
      TS2_KMAX: '8'
      TS2_BS: '8'
      TS2_GROUP: '64'
      TS2_SEED: '20260817'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers>=4.48,<5' safetensors
      - name: Run frozen block benchmark
        run: python research/thresholdspec/block_benchmark.py
      - name: Show summary
        if: always()
        run: cat results/thresholdspec-block-exp002/summary.json || true
      - name: Upload raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thresholdspec-block-exp002
          path: results/thresholdspec-block-exp002/
          if-no-files-found: error

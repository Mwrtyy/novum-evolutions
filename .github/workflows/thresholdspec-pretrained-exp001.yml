name: ThresholdSpec pretrained EXP-001

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      THRESHOLDSPEC_N: '1024'
      THRESHOLDSPEC_CTX: '32'
      THRESHOLDSPEC_BS: '8'
      THRESHOLDSPEC_GROUP: '64'
      THRESHOLDSPEC_SEED: '20260817'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers>=4.48,<5' safetensors
      - name: Run frozen benchmark
        run: python research/thresholdspec/benchmark.py
      - name: Show summary
        if: always()
        run: cat results/thresholdspec-pretrained/summary.json || true
      - name: Upload raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thresholdspec-pretrained-exp001
          path: results/thresholdspec-pretrained/
          if-no-files-found: error
